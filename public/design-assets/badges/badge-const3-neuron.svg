  <circle cx="92" cy="148" r="9" fill="none" stroke="#c070f0" stroke-width="5" opacity="0.9"/>
  <circle cx="84" cy="196" r="8" fill="none" stroke="#c070f0" stroke-width="5" opacity="0.9"/>
  <circle cx="108" cy="312" r="8" fill="none" stroke="#c070f0" stroke-width="5" opacity="0.9"/>
  <!-- 细胞体 -->
  <circle cx="240" cy="250" r="70" fill="none" stroke="#ffffff" stroke-width="20" opacity="0.95"/>
  <circle cx="240" cy="250" r="34" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.6"/>
  <circle cx="240" cy="250" r="12" fill="#c070f0"/>
  <!-- 轴突（右侧长轴） -->
  <path d="M310 250 C 360 250, 372 268, 356 300 C 344 324, 356 344, 380 340"
