  <path d="M380 340 C 400 330, 420 334, 428 356" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
  <path d="M380 340 C 398 352, 412 352, 424 370" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
  <!-- 突触小泡 -->
  <circle cx="428" cy="356" r="7" fill="#c070f0"/>
  <circle cx="424" cy="370" r="7" fill="#c070f0"/>
